name: legal_expart
description: Bilingual Legal Expart legal services Android app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_svg: ^2.0.10+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/legal_expart_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/legal_expart_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/legal_expart_logo.svg
