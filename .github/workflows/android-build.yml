name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --org technology.greatindia .
      - name: Set requested Android application ID
        shell: bash
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.legalexpart.app"/' android/app/build.gradle
            sed -i 's/namespace "[^"]*"/namespace "com.legalexpart.app"/' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.legalexpart.app"/' android/app/build.gradle.kts
            sed -i 's/namespace = "[^"]*"/namespace = "com.legalexpart.app"/' android/app/build.gradle.kts
          fi
      - name: Add Firebase Android configuration when provided
        run: |
          if [ -f google-services.json ]; then mkdir -p android/app; cp google-services.json android/app/google-services.json; fi
      - name: Render branded app icon
        run: |
          python -m pip install --quiet cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='assets/legal_expart_logo.svg', write_to='assets/legal_expart_icon.png', output_width=512, output_height=512)"
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos lib
      - name: Generate a new upload keystore
        shell: bash
        run: |
          mkdir -p signing
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          KEY_PASS="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          echo "$STORE_PASS" > signing/keystore-password.txt
          echo "$KEY_PASS" > signing/key-password.txt
          keytool -genkeypair -v -keystore signing/legal-expart-upload.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias legal-expart-upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legal Expart, OU=Great India Technology, O=Great India Technology, L=Patna, ST=Bihar, C=IN"
      - name: Upload generated keystore and password files
        uses: actions/upload-artifact@v4
        with:
          name: legal-expart-upload-keystore
          path: signing/
          if-no-files-found: error
          retention-days: 7
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release app bundle
        run: flutter build appbundle --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-expart-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-expart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: legal-expart-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  build-windows-admin:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows desktop scaffolding
        run: flutter create --platforms=windows --org technology.greatindia .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos lib
      - name: Build Windows desktop app
        run: flutter build windows --release
      - name: Package Windows admin app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath legal-expart-windows-admin.zip
      - name: Upload Windows admin app
        uses: actions/upload-artifact@v4
        with:
          name: legal-expart-windows-admin
          path: legal-expart-windows-admin.zip
          if-no-files-found: error
          retention-days: 14
